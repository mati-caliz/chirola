# Producción de chirola en el server (Hetzner).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# api queda en la red externa `shared-nginx` (sin ruta pública en proxy-nginx:
# no hay ningun cliente publico todavia, la app mobile aun no existe) para que
# otros stacks del mismo host, como respondi, le hablen por nombre de servicio
# `http://chirola-api:3000`. db vive solo en la red interna. Secretos en .env
# (gitignored).
#
# El schema se aplica con prisma migrate, NO se crea solo al levantar:
#   docker compose -f docker-compose.prod.yml --env-file .env run --rm --build api-tools pnpm prisma migrate deploy

name: chirola

services:
  db:
    image: base-images/postgres:16
    container_name: chirola-db
    restart: unless-stopped
    # El planner venia con effective_cache_size en los 4 GB de fabrica dentro de un
    # contenedor de 512M: elegia planes creyendo que tenia varias veces la memoria real.
    # random_page_cost 4.0 asume disco rotativo y este server es NVMe.
    command: >
      postgres
      -c effective_cache_size=320MB
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chirola_pgdata:/var/lib/postgresql/data
    networks:
      - chirola-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    deploy:
      resources:
        limits:
          pids: 512
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    container_name: chirola-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chirola-internal
      - shared-nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          pids: 512
          memory: 500M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Migraciones y scripts de alta (prisma, ts-node): la imagen de api no trae devDependencies.
  # Siempre con --build, para no correr contra una imagen vieja.
  api-tools:
    pids_limit: 512
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: tools
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chirola-internal
    restart: "no"

networks:
  # Acá sólo está la base, que no necesita salir a internet. La API sale por shared-nginx.
  chirola-internal:
    driver: bridge
    internal: true
  shared-nginx:
    external: true

volumes:
  chirola_pgdata:
