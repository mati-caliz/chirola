# Producción de chirola en el server (Hetzner).
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# api queda en la red externa `shared-nginx` (sin ruta pública en proxy-nginx:
# no hay ningun cliente publico todavia, la app mobile aun no existe) para que
# otros stacks del mismo host, como respondi, le hablen por nombre de servicio
# `http://chirola-api:3000`. db vive solo en la red interna. Secretos en .env
# (gitignored).
#
# El schema se aplica con prisma migrate, NO se crea solo al levantar:
#   docker compose -f docker-compose.prod.yml --env-file .env run --rm api pnpm prisma migrate deploy

name: chirola

services:
  db:
    image: postgres:16-alpine
    container_name: chirola-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chirola_pgdata:/var/lib/postgresql/data
    networks:
      - chirola-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: chirola-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chirola-internal
      - shared-nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 500M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chirola-internal:
    driver: bridge
  shared-nginx:
    external: true

volumes:
  chirola_pgdata:
