# Proyecto propio para que un `docker compose up` sin -f nunca reconcilie
# los containers de produccion, que corren bajo el proyecto `chirola`.
name: chirola-dev

services:
  db:
    image: postgres:16-alpine
    container_name: chirola-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirola
      POSTGRES_PASSWORD: chirola
      POSTGRES_DB: chirola
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chirola_pgdata:/var/lib/postgresql/data

volumes:
  chirola_pgdata: