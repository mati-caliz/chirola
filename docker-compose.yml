services:
  db:
    image: postgres:16-alpine
    container_name: chirola-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirola
      POSTGRES_PASSWORD: chirola
      POSTGRES_DB: chirola
    ports:
      - "5432:5432"
    volumes:
      - chirola_pgdata:/var/lib/postgresql/data

volumes:
  chirola_pgdata:
